// Offline configuration file
// Pre-pull images with conts/get_all.sh, then run with -profile offline

profiles {
    offline {
        apptainer {
            enabled    = true
            autoMounts = true
        }
        process {
            containerOptions = '--writable-tmpfs'
            withName: 'CELLDEX_DOWNLOAD' {
                container = "${projectDir}/conts/CELLDEX_DOWNLOAD.img"
            }
            withName: 'CELLTYPES_SINGLER' {
                container = "${projectDir}/conts/CELLTYPES_SINGLER.img"
            }
            withName: 'CELLTYPES_CELLTYPIST' {
                container = "${projectDir}/conts/CELLTYPES_CELLTYPIST.img"
            }
            withName: 'QC' {
                container = "${projectDir}/conts/QC.img"
            }
            withName: 'CLUSTERING' {
                container = "${projectDir}/conts/CLUSTERING.img"
            }
            withName: 'SPATIAL' {
                container = "${projectDir}/conts/SPATIAL.img"
            }
            withName: 'REPORT_DATA' {
                container = "${projectDir}/conts/REPORT_DATA.img"
            }
            withName: 'REPORT' {
                container = "${projectDir}/conts/QUARTO.img"
            }
        }
    }
}
