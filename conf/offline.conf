// Offline configuration file
// Pre-pull images with conts/get_all.sh, then run with -profile offline

profiles {
    offline {
        apptainer {
            enabled    = true
            autoMounts = true
        }
        process {
            containerOptions = '--writable-tmpfs'
            withName: 'CELLDEX_DOWNLOAD' {
                container = "${projectDir}/conts/CELLDEX_DOWNLOAD.img"
            }
            withName: 'CELLTYPES_SINGLER' {
                container = "${projectDir}/conts/CELLTYPES_SINGLER.img"
            }
            withName: 'QC|CLUSTERING|SPATIAL|CELLTYPES_CELLTYPIST|REPORT_DATA' {
                container = "${projectDir}/conts/PYTHON.img"
            }
            withName: 'REPORT' {
                container = "${projectDir}/conts/QUARTO.img"
            }
        }
    }
}
